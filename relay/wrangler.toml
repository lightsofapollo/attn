name = "attn-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# account_id is intentionally NOT hardcoded — wrangler resolves it from
# `wrangler login` or the CLOUDFLARE_ACCOUNT_ID env var, so this config stays
# account-agnostic and safe to commit. See relay/README.md §Deploy.

# Production custom domain. `wrangler deploy` provisions the Workers Custom
# Domain (DNS record + TLS cert) for relay.attn.sh — requires the attn.sh zone
# in the deploying account. Clients point ATTN_DEFAULT_RELAY_URL here.
[[routes]]
pattern = "relay.attn.sh"
custom_domain = true

# Production observability — surfaces invocation logs + metrics in the
# Cloudflare dashboard. The relay is low-QPS, so full (100%) sampling is
# affordable and worth it for a fresh production surface.
[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "RELAY_ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "RELAY_QUOTAS"
class_name = "QuotaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["QuotaDO"]

[[r2_buckets]]
binding = "RELAY_BLOBS"
bucket_name = "attn-relay-blobs"

[vars]
HARD_MAX_PEERS = "8"
HARD_MAX_ROOM_BYTES = "26214400"
HARD_MAX_EVENT_BYTES = "262144"
HARD_MAX_SNAPSHOT_BYTES = "5242880"
HARD_MAX_EVENTS = "500"
HARD_MAX_BATCH_ENVELOPES = "32"
HARD_MAX_TTL_MS = "86400000"          # 24h default
HARD_MAX_TTL_LONG_MS = "604800000"    # 7d for longSession rooms
DEFAULT_IDLE_TIMEOUT_MS = "3600000"   # 1h
DEFAULT_POW_BITS = "16"
MIN_POW_BITS = "12"
MAX_POW_BITS = "24"
# Comma-separated allowlist consumed by relay/src/index.ts `corsMiddleware` and
# relay/src/room-do.ts `handleSocketUpgrade`. For WebSockets, the public Worker
# snapshots the edge Origin into a private, overwrite-only context because the
# standard header is rewritten during Worker -> DO forwarding. Browsers must
# match one of these origins when `policy.allowBrowser == true`; native clients
# are represented by an explicit no-Origin sentinel and bypass the allowlist.
# This gates the in-browser reviewer served from attn.sh + staging.
ALLOWED_BROWSER_ORIGINS = "https://attn.sh,https://staging.attn.sh"
# Conservative reserved-capacity admission. Every live room immediately
# reserves HARD_MAX_ROOM_BYTES (25 MiB), regardless of current ciphertext use.
QUOTA_MAX_LIVE_ROOMS_PER_SOURCE = "8"
QUOTA_MAX_ALLOCATED_BYTES_PER_SOURCE_24H = "268435456" # 256 MiB, non-refundable
QUOTA_GLOBAL_MAX_LIVE_ROOMS = "512"
QUOTA_GLOBAL_MAX_RESERVED_BYTES = "6710886400" # 6.25 GiB / 256 full rooms

# Staging deploys to a DISTINCT worker and custom domain. The explicit route
# prevents top-level production-route inheritance while giving hosted staging
# builds one stable relay origin. Durable Object namespaces are per-worker, so
# staging rooms remain isolated from production.
[env.staging]
name = "attn-relay-staging"
workers_dev = false
routes = [{ pattern = "relay-staging.attn.sh", custom_domain = true }]

[env.staging.vars]
# vars are NOT inherited by named environments, so the full set is repeated
# here (otherwise a staging deploy is missing HARD_MAX_*/POW config and 500s).
HARD_MAX_PEERS = "8"
HARD_MAX_ROOM_BYTES = "26214400"
HARD_MAX_EVENT_BYTES = "262144"
HARD_MAX_SNAPSHOT_BYTES = "5242880"
HARD_MAX_EVENTS = "500"
HARD_MAX_BATCH_ENVELOPES = "32"
HARD_MAX_TTL_MS = "86400000"
HARD_MAX_TTL_LONG_MS = "604800000"
DEFAULT_IDLE_TIMEOUT_MS = "3600000"
DEFAULT_POW_BITS = "16"
MIN_POW_BITS = "12"
MAX_POW_BITS = "24"
ALLOWED_BROWSER_ORIGINS = "https://staging.attn.sh,http://localhost:5173"
# Staging deploy/E2E runs create short-lived isolated rooms repeatedly from one
# CI/developer edge IP. Keep production at 8 while allowing verification runs
# to coexist until their normal idle alarms reap them.
QUOTA_MAX_LIVE_ROOMS_PER_SOURCE = "32"
# Each room reserves 25 MiB; repeated staging verification from one CI IP
# needs more than production's 256 MiB non-refundable daily allowance.
QUOTA_MAX_ALLOCATED_BYTES_PER_SOURCE_24H = "1073741824"
QUOTA_GLOBAL_MAX_LIVE_ROOMS = "512"
QUOTA_GLOBAL_MAX_RESERVED_BYTES = "6710886400"

# Named environments do NOT inherit durable_objects / r2_buckets / migrations
# from the top level, so they're declared explicitly here. The DO namespace is
# scoped to the (distinct) staging worker, so staging rooms never touch prod.
# The R2 bucket name is shared, but objects are keyed by roomId so staging +
# prod blobs never collide.
[[env.staging.durable_objects.bindings]]
name = "RELAY_ROOMS"
class_name = "RoomDO"

[[env.staging.durable_objects.bindings]]
name = "RELAY_QUOTAS"
class_name = "QuotaDO"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["QuotaDO"]

[[env.staging.r2_buckets]]
binding = "RELAY_BLOBS"
bucket_name = "attn-relay-blobs-staging"
