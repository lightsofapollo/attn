<!DOCTYPE html>
<html lang="en" data-theme="light" data-typeset="editorial">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>attn</title>
  <!-- The attn mark as an inline data URI, not a file.

       This entry is bundled by vite-plugin-singlefile and the resulting HTML
       is embedded in the Rust binary, then served from memory at `attn://app`.
       A `/favicon.png` link would resolve against the custom protocol and 404
       there, so the icon has to travel inside the document. The geometry is
       the same hash-on-paper tile as web/src/lib/BrandMark.svelte — keep the
       two in step if the mark is ever redrawn. -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='21.6'%20fill='%23e7ddd3'/%3E%3Cg%20fill='%2358524a'%20transform='translate(0%2047.9)%20skewX(-9.52)%20translate(0%20-47.9)'%3E%3Crect%20x='34.2'%20y='18.2'%20width='9.9'%20height='59.5'%20rx='1.6'/%3E%3Crect%20x='55.8'%20y='18.2'%20width='9.9'%20height='59.5'%20rx='1.6'/%3E%3Crect%20x='22.2'%20y='31.4'%20width='54.7'%20height='9.25'%20rx='1.6'/%3E%3Crect%20x='22.2'%20y='53.8'%20width='54.7'%20height='9.15'%20rx='1.6'/%3E%3C/g%3E%3C/svg%3E"
  />
  <script>
    /* Resolve the seeded appearance BEFORE any content paints.

       Rust stamps the stored PREFERENCE into data-theme (light | dark |
       system); `system` still has to become a concrete light/dark, and the
       .dark class has to exist for Tailwind's dark: variants. Doing that here
       — inline, synchronous, ahead of the module bundle — is what keeps a
       dark-mode user from seeing a frame of paper white on every launch.
       web/src/lib/theme.ts takes ownership from here and tracks later OS
       appearance changes. */
    (function () {
      try {
        var root = document.documentElement;
        var preference = root.getAttribute('data-theme') || 'system';
        if (preference !== 'light' && preference !== 'dark') preference = 'system';
        var dark = preference === 'dark'
          || (preference === 'system'
              && typeof window.matchMedia === 'function'
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-theme-preference', preference);
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.classList.toggle('dark', dark);
      } catch (e) {
        /* Never let appearance resolution block the app from booting. */
      }
    })();
  </script>
</head>
<body>
  <div id="app" style="display:none"></div>
  <!-- INIT_SCRIPT -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
