name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (dev)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (release)
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      # Binary-size gate — enforces the 30 MiB target from
      # planning/collab/amendments.md §Decision #1 (webrtc-rs is the main risk).
      # Emergency bypass via env: ATTN_SIZE_BUDGET_WAIVER=1 (also accepts
      # BINARY_SIZE_WAIVER=1). See CLAUDE.md §"Binary-size gate".
      - name: Build release for size check
        run: cargo build --release --locked

      - name: Check binary size (30 MiB budget)
        run: scripts/check-binary-size.sh

  rust-build-linux:
    name: Rust Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

  web-check:
    name: Web Check (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  relay-tests:
    name: Relay Tests (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The relay is the collab backbone (room auth, caps, PoW, abuse gates).
      # Its vitest-pool-workers suite (~293 tests) previously ran only on the
      # manual relay-deploy workflow — gate it on every PR/push so the collab
      # path can't regress unnoticed.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
