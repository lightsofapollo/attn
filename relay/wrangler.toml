name = "attn-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "RELAY_ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[r2_buckets]]
binding = "RELAY_BLOBS"
bucket_name = "attn-relay-blobs"

[vars]
HARD_MAX_PEERS = "8"
HARD_MAX_ROOM_BYTES = "26214400"
HARD_MAX_EVENT_BYTES = "262144"
HARD_MAX_SNAPSHOT_BYTES = "5242880"
HARD_MAX_EVENTS = "500"
HARD_MAX_BATCH_ENVELOPES = "32"
HARD_MAX_TTL_MS = "86400000"          # 24h default
HARD_MAX_TTL_LONG_MS = "604800000"    # 7d for longSession rooms
DEFAULT_IDLE_TIMEOUT_MS = "3600000"   # 1h
DEFAULT_POW_BITS = "16"
MIN_POW_BITS = "12"
MAX_POW_BITS = "24"
# Comma-separated allowlist consumed by relay/src/index.ts `corsMiddleware` and
# relay/src/room-do.ts `handleSocketUpgrade` (Origin check). Browsers must
# match one of these origins when `policy.allowBrowser == true`; native
# clients (no Origin header) bypass the check entirely. Multiple origins are
# intentional for the prod target so the marketing site + the app domain
# can both share one relay.
ALLOWED_BROWSER_ORIGINS = "https://attn.dev,https://staging.attn.dev"

[env.staging.vars]
ALLOWED_BROWSER_ORIGINS = "https://staging.attn.dev,http://localhost:5173"
