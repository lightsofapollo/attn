[package]
name = "attn-anchor-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
comrak = { version = "0.52", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# wasm-pack's bundled Binaryen currently validates without bulk-memory even
# though current rustc emits those standard instructions. Keep rustc's size
# optimizations and skip that incompatible post-pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
